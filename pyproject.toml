[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-lesson-planner"
version = "0.1.0"
description = "A reproducible Phase 1 multi-agent lesson-plan workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
real = [
  "openai>=1.50,<3",
  "python-dotenv>=1,<2",
  "socksio>=1,<2",
]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lesson_agents = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
